name: Deploy dev with Docker Compose

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (dev)
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: yang0709/journal-backend:dev

      - name: Upload deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.dev.yml"
          target: "/opt/journal-dev"
          strip_components: 0
          overwrite: true

      - name: Deploy to server with Docker Compose (dev)
        uses: appleboy/ssh-action@v1.0.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 30m
          script: |
            sudo docker --version
            sudo docker compose version
            cd /opt/journal-dev
            cat > .env <<EOF
            JWT_SECRET=${{ secrets.JWT_SECRET_DEV }}
            WX_APPID=${{ secrets.WX_APPID }}
            WX_SECRET=${{ secrets.WX_SECRET }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            SENSITIVE_WORDS_KEY=${{ secrets.SENSITIVE_WORDS_KEY }}
            NODE_ENV=development
            LOG_LEVEL=info
            LOG_MAX_SIZE=5m
            LOG_MAX_FILES=7d
            COS_SECRET_ID=${{ secrets.COS_SECRET_ID }}
            COS_SECRET_KEY=${{ secrets.COS_SECRET_KEY }}
            COS_BUCKET=${{ secrets.COS_BUCKET }}
            COS_REGION=${{ secrets.COS_REGION }}
            COS_PUBLIC_DOMAIN=${{ secrets.COS_PUBLIC_DOMAIN }}
            COS_UPLOAD_DIR=journal
            COS_STS_DURATION_SECONDS=1800
            COS_MAX_FILE_SIZE_MB=10
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            DEEPSEEK_API_BASE=https://api.deepseek.com
            DEEPSEEK_MODEL=deepseek-chat
            ADMIN_JWT_SECRET=${{ secrets.ADMIN_JWT_SECRET }}
            ADMIN_JWT_EXPIRES_IN=7d
            ADMIN_BOOTSTRAP_USERNAME=${{ secrets.ADMIN_BOOTSTRAP_USERNAME }}
            ADMIN_BOOTSTRAP_PASSWORD=${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
            ADMIN_LOGIN_CAPTCHA_ENABLED=true
            ADMIN_LOGIN_CAPTCHA_TTL_SECONDS=120
            ADMIN_LOGIN_CAPTCHA_STORE=auto
            ADMIN_LOGIN_IP_LIMIT=10
            ADMIN_LOGIN_USERNAME_LIMIT=5
            ADMIN_LOGIN_LOCK_FAIL_THRESHOLD=10
            ADMIN_LOGIN_LOCK_MINUTES=15
            ADMIN_LOGIN_CAPTCHA_CREATE_IP_LIMIT=30
            # dev 环境 NODE_ENV=development，未部署 admin 时可留空（localhost 自动放行）
            ADMIN_CORS_ORIGIN=
            WECHAT_MP_APPID=${{ secrets.WECHAT_MP_APPID }}
            WECHAT_MP_SECRET=${{ secrets.WECHAT_MP_SECRET }}
            WECHAT_MP_ADMIN_OPENID=${{ secrets.WECHAT_MP_ADMIN_OPENID }}
            WECHAT_MP_TEMPLATE_ADMIN_LOGIN=D2c9fO-jdGn1TBmjYa_rUSYiCZ4UbiR22tpNRqeSvr4
            WECHAT_MP_TEMPLATE_ALERT=Z882lQ4PSNvLpztDazEye8WAAVD-0KIXUMq3q5PpO1o
            WECHAT_MP_TEMPLATE_ADMIN_OPS=N3vFUH3Fr8yMrEi_ffB5Krry2zh4DWRVmiawqqBT2qY
            WECHAT_MP_NOTIFY_ENABLED=true
            WECHAT_MP_NOTIFY_ADMIN_LOGIN=true
            WECHAT_MP_NOTIFY_ALERT=true
            WECHAT_MP_NOTIFY_ADMIN_OPS=true
            WECHAT_MP_NOTIFY_ADMIN_LOGIN_FAIL=true
            WECHAT_MP_ADMIN_LOGIN_FAIL_WINDOW_MINUTES=5
            WECHAT_MP_ADMIN_LOGIN_FAIL_THRESHOLD=5
            SERVERCHAN_SENDKEY=${{ secrets.SERVERCHAN_SENDKEY }}
            SERVERCHAN_NOTIFY_ENABLED=true
            SERVERCHAN_NOTIFY_ADMIN_LOGIN=true
            UPLOAD_DAILY_BASE_LIMIT=15
            AI_DAILY_BASE_LIMIT=5
            EOF
            sudo docker pull yang0709/journal-backend:dev
            sudo docker compose -f docker-compose.dev.yml down
            sudo docker compose -f docker-compose.dev.yml up --force-recreate -d
            sudo docker image prune -f