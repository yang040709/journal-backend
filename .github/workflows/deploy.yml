name: Deploy with Docker Compose

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            yang0709/journal-backend:${{ github.sha }}
            yang0709/journal-backend:latest
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Assert sha and latest digests match
        run: |
          set -euo pipefail
          # buildx 对 --format 有坑：须用 json 函数，见 docker/buildx#1175
          SHA_DIGEST=$(docker buildx imagetools inspect "yang0709/journal-backend:${{ github.sha }}" --format '{{json .Manifest.Digest}}' | xargs)
          LATEST_DIGEST=$(docker buildx imagetools inspect "yang0709/journal-backend:latest" --format '{{json .Manifest.Digest}}' | xargs)
          echo "sha digest=$SHA_DIGEST"
          echo "latest digest=$LATEST_DIGEST"
          test -n "$SHA_DIGEST"
          test -n "$LATEST_DIGEST"
          test "$SHA_DIGEST" = "$LATEST_DIGEST"

      - name: Write deploy summary
        run: |
          {
            echo "## Backend deploy (production)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| deployed_sha | \`${{ github.sha }}\` |"
            echo "| branch | \`${{ github.ref_name }}\` |"
            echo "| image (immutable) | \`yang0709/journal-backend:${{ github.sha }}\` |"
            echo "| image (floating) | \`yang0709/journal-backend:latest\` |"
            echo "| at (UTC) | \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 新增：选择性上传部署文件到服务器
      - name: Upload deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.yml" # 只传docker-compose.yml
          target: "/opt/journal"
          strip_components: 0
          overwrite: true

      - name: Deploy to server with Docker Compose
        uses: appleboy/ssh-action@v1.0.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 30m
          script: |
            # 检查 Docker 和 Docker Compose 是否安装
            sudo docker --version
            sudo docker compose version
            # 进入项目目录
            cd /opt/journal
            # 创建 .env 文件
            cat > .env <<EOF
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            WX_APPID=${{ secrets.WX_APPID }}
            WX_SECRET=${{ secrets.WX_SECRET }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            SENSITIVE_WORDS_KEY=${{ secrets.SENSITIVE_WORDS_KEY }}
            NODE_ENV=production
            LOG_LEVEL=info
            LOG_MAX_SIZE=5m
            LOG_MAX_FILES=7d
            COS_SECRET_ID=${{ secrets.COS_SECRET_ID }}
            COS_SECRET_KEY=${{ secrets.COS_SECRET_KEY }}
            COS_BUCKET=${{ secrets.COS_BUCKET }}
            COS_REGION=${{ secrets.COS_REGION }}
            COS_PUBLIC_DOMAIN=${{ secrets.COS_PUBLIC_DOMAIN }}
            COS_UPLOAD_DIR=journal
            COS_STS_DURATION_SECONDS=1800
            COS_MAX_FILE_SIZE_MB=10
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            DEEPSEEK_API_BASE=https://api.deepseek.com
            DEEPSEEK_MODEL=deepseek-chat
            ADMIN_JWT_SECRET=${{ secrets.ADMIN_JWT_SECRET }}
            ADMIN_JWT_EXPIRES_IN=1d
            ADMIN_BOOTSTRAP_USERNAME=${{ secrets.ADMIN_BOOTSTRAP_USERNAME }}
            ADMIN_BOOTSTRAP_PASSWORD=${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
            ADMIN_LOGIN_CAPTCHA_ENABLED=true
            ADMIN_LOGIN_CAPTCHA_TTL_SECONDS=120
            ADMIN_LOGIN_CAPTCHA_STORE=auto
            ADMIN_LOGIN_IP_LIMIT=10
            ADMIN_LOGIN_USERNAME_LIMIT=5
            ADMIN_LOGIN_LOCK_FAIL_THRESHOLD=10
            ADMIN_LOGIN_LOCK_MINUTES=15
            ADMIN_LOGIN_CAPTCHA_CREATE_IP_LIMIT=30
            # 管理后台上线后再填，例如 https://admin.example.com
            ADMIN_CORS_ORIGIN=
            WECHAT_MP_APPID=${{ secrets.WECHAT_MP_APPID }}
            WECHAT_MP_SECRET=${{ secrets.WECHAT_MP_SECRET }}
            WECHAT_MP_ADMIN_OPENID=${{ secrets.WECHAT_MP_ADMIN_OPENID }}
            WECHAT_MP_TEMPLATE_ADMIN_LOGIN=D2c9fO-jdGn1TBmjYa_rUSYiCZ4UbiR22tpNRqeSvr4
            WECHAT_MP_TEMPLATE_ALERT=Z882lQ4PSNvLpztDazEye8WAAVD-0KIXUMq3q5PpO1o
            WECHAT_MP_TEMPLATE_ADMIN_OPS=N3vFUH3Fr8yMrEi_ffB5Krry2zh4DWRVmiawqqBT2qY
            WECHAT_MP_NOTIFY_ENABLED=true
            WECHAT_MP_NOTIFY_ADMIN_LOGIN=true
            WECHAT_MP_NOTIFY_ALERT=true
            WECHAT_MP_NOTIFY_ADMIN_OPS=true
            WECHAT_MP_NOTIFY_ADMIN_LOGIN_FAIL=true
            WECHAT_MP_ADMIN_LOGIN_FAIL_WINDOW_MINUTES=5
            WECHAT_MP_ADMIN_LOGIN_FAIL_THRESHOLD=5
            SERVERCHAN_SENDKEY=${{ secrets.SERVERCHAN_SENDKEY }}
            SERVERCHAN_NOTIFY_ENABLED=true
            SERVERCHAN_NOTIFY_ADMIN_LOGIN=true
            UPLOAD_DAILY_BASE_LIMIT=15
            AI_DAILY_BASE_LIMIT=5
            EOF
            # 先拉 immutable sha，再打成本地 latest，保证 compose 跑的是本次构建
            sudo docker pull yang0709/journal-backend:${{ github.sha }}
            sudo docker tag yang0709/journal-backend:${{ github.sha }} yang0709/journal-backend:latest
            # 停止并删除现有容器
            sudo docker compose down
            # --pull never：避免 up 时再拉 Hub latest，被并发部署覆盖本地 retag
            sudo docker compose -f docker-compose.yml up --force-recreate --pull never -d
            # 清理未使用的本地镜像；Hub 上 sha tag 仍保留，不影响回滚窗口
            sudo docker image prune -f
